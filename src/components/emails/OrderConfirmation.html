<!doctype html>
<html>
  <head>
    <style>
      body {
        font-family: 'Inter', Helvetica, sans-serif;
        margin: 0;
        padding: 0;
        -webkit-text-size-adjust: none;
        width: 100% !important;
        background-color: #f9fafb;
      }
      .container {
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        border: 1px solid #eeeeee;
      }
      .header {
        background: #0f0f0f;
        color: #ffffff;
        padding: 40px;
        text-align: center;
      }
      .content {
        padding: 40px;
        color: #111827;
        line-height: 1.6;
      }
      .footer {
        padding: 20px;
        text-align: center;
        font-size: 10px;
        color: #9ca3af;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .button {
        background: #10b981;
        color: #000000;
        padding: 15px 25px;
        text-decoration: none;
        font-weight: bold;
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1 style="letter-spacing: -2px; margin: 0">SYMENO.</h1>
      </div>
      <div class="content">
        <h2 style="margin-top: 0">Deployment Confirmed.</h2>
        <p>
          Order <strong>#{{order_id}}</strong> has been injected into our
          logistics queue. We are currently verifying the hardware before
          dispatch.
        </p>
        <div
          style="
            margin: 30px 0;
            border-top: 1px solid #eeeeee;
            padding-top: 20px;
          "
        >
          <p style="font-size: 12px; color: #6b7280; margin: 0">
            Tracking Number will be issued within 24 hours.
          </p>
        </div>
        <a href="{{tracking_url}}" class="button">Track Real-Time Status</a>
      </div>
      <div class="footer">
        &copy; 2026 Symeno LLC | Operational Efficiency Guaranteed.
      </div>
    </div>
  </body>
</html>
