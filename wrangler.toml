name = "symeno"
# Entry point for Astro's SSR bundle
# main = "./dist/_worker.js/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = [ "nodejs_compat_v2" ]

# Tells Cloudflare to serve static files from the dist folder
assets = { directory = "./dist" }

[vars]
PUBLIC_STRIPE_KEY = "pk_test_placeholder"
PUBLIC_SITE_URL = "https://symeno.com"
R2_ACCOUNT_ID = "your_cloudflare_account_id"
R2_BUCKET_NAME = "symeno-images"
PUBLIC_TURNSTILE_SITE_KEY = "0x4AAAAAADPXEom1ry2-MIFB"

[[d1_databases]]
binding = "DB"
database_name = "symeno-prod-db"
database_id = "cb2b84d5-a116-4614-8560-becf42434855"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "SESSION"
id = "554c5c4c4a74400e9a14c969f80d0327" # ✅ Mapped to existing symeno-store-session

# NOTE: If your R2 bucket is not yet enabled in the dashboard, 
# keep the lines below commented out to prevent a [code: 10042] error.
# [[r2_buckets]]
# binding = "IMAGES"
# bucket_name = "symeno-images"

[[queues.producers]]
binding = "EMAIL_QUEUE"
queue = "symeno-email-queue"

# PREVIEW ENVIRONMENT (Pages/Workers Hybrid)
[env.preview]
name = "symeno-preview"

[env.preview.vars]
PUBLIC_STRIPE_KEY = "pk_test_placeholder"
PUBLIC_SITE_URL = "https://staging.symeno.com"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "symeno-db-staging"
database_id = "preview-symeno-db-id"

[[env.preview.kv_namespaces]]
binding = "SESSION"
id = "554c5c4c4a74400e9a14c969f80d0327" # Using same for now; swap if you make a staging KV